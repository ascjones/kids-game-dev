<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Game Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="intake-root"></div>
      <div id="workbench" hidden>
        <div id="game-container"></div>
        <div id="left-dock">
          <div id="play-controls"></div>
          <div id="challenge-panel"></div>
          <div id="game-maker-box"></div>
        </div>
        <div id="editor-overlay" hidden>
          <div id="editor-frame">
            <div id="editor-toolbar"></div>
            <div id="editor-main">
              <div id="blockly-container"></div>
              <div id="editor-side">
                <div id="challenge-slot"></div>
                <div id="js-view"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="kid-notice-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
